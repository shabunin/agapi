[package]
name = "app"
version = "0.0.1"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["protocol-asset", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.20.0", features = ["v4"] }
socket2 = { version = "0.5", features = ["all"] }
axum = { version = "0.8.4", features = ["ws"] }
tauri-plugin-http = { version = "2", features = ["dangerous-settings", "unsafe-headers", "rustls-tls-webpki-roots"] }
tauri-plugin-websocket = "2"
bytes = "1.11.1"
tokio-util = "0.7.18"
futures-util = "0.3.32"
# TLS client (Node-shaped tls.connect)
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
rustls-pki-types = "1"
mdns-sd = { version = "0.20", features = ["serde"] }
hostname = "0.4"
if-addrs = "0.15"
